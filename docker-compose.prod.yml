version: '3.7'

services:
  nginx:
    ports:
      - '80:80'

  app:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      target: prod
    image: ${PROJECT_SHORT_NAME}:latest
    volumes: &volumes
      - sab_public_data:/var/www/public
      - ./var/storage:/var/www/var/storage
      - ./var/log:/var/www/var/log
      - ./var/lock:/var/www/var/lock
      - ./.env.local:/var/www/.env.local
      - ./templates:/var/www/templates
      - ./migrations:/var/www/migrations

  cli:
    image: ${PROJECT_SHORT_NAME}:latest
    command: cli
    volumes: *volumes
    networks:
      - sab-network
    hostname: cli
    container_name: ${PROJECT_SHORT_NAME}-cli
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: ${PROJECT_SHORT_NAME}-postgres
    networks:
      - sab-network
    restart: always
    environment:
      POSTGRES_PASSWORD: root
      LANG: C.UTF-8
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

